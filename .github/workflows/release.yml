name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-22.04   # old glibc => the AppImage runs on most distros
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libxcb1-dev libxkbcommon-x11-dev libdbus-1-dev pkg-config file desktop-file-utils
      - name: Build
        run: cargo build --release --locked -p inkwell
      - name: Self-test the binary
        run: ./target/release/inkwell --self-test
      - name: Package AppImage (linuxdeploy)
        run: |
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          mkdir -p AppDir
          VERSION="${VERSION#v}" ./linuxdeploy --appimage-extract-and-run --appdir AppDir \
            --executable target/release/inkwell \
            --desktop-file packaging/inkwell.desktop \
            --icon-file packaging/inkwell.png --icon-filename inkwell \
            --output appimage
          mkdir -p dist
          mv Inkwell-*.AppImage "dist/Inkwell-${VERSION}-x86_64.AppImage"
      - name: Self-test the AppImage
        run: |
          chmod +x dist/*.AppImage
          dist/*.AppImage --appimage-extract-and-run --self-test
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p inkwell --target x86_64-pc-windows-msvc
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/inkwell.exe dist/inkwell.exe
      - name: Self-test the exe
        shell: pwsh
        run: |
          ./dist/inkwell.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }
      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path dist/inkwell.exe, LICENSE, README.md -DestinationPath "dist/Inkwell-$v-windows-x86_64-portable.zip"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:INKWELL_VERSION = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\inkwell.iss
      - name: Self-test the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/DIR=$PWD\installed" -Wait
          & "$PWD\installed\inkwell.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "installed self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --draft --title "Inkwell ${{ github.ref_name }}" \
            --notes "Draft. See CHANGELOG.md. Verify with SHA256SUMS."
