[package]
name = "scrawl"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ink.workspace = true
tiny-skia.workspace = true
recog = { path = "../recog" }
layout = { path = "../layout" }
render = { path = "../render" }
notedoc = { path = "../doc" }
docview = { path = "../docview" }
store = { path = "../store" }
search = { path = "../search" }
export = { path = "../export" }
remote = { path = "../remote" }
media = { path = "../media" }
input = { path = "../input" }
slint = { version = "1.18", features = ["software-renderer-systemfonts", "unstable-winit-030"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control", "image-data"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
spellbook = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.23.1"

[build-dependencies]
slint-build = "1.18"
