[package]
name = "remote"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "service"] }
if-addrs = "0.15.0"
keyring = "4.2.0"
qrcode = "0.14.1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.1"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tower-service = "0.3.3"

[dev-dependencies]
rustls-webpki = { version = "0.103.16", features = ["ring", "alloc"] }
x509-parser = "0.18.1"
tokio-tungstenite = "0.30.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
